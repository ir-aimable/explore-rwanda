<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore Rwanda: discover places, find trips, compare costs and go together." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme (or the device setting) before first paint to avoid a flash.
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('er_theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Explore Rwanda</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (system font shows until they arrive). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spinnaker&family=Meow+Script&family=Rubik:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spinnaker&family=Meow+Script&family=Rubik:wght@700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Spinnaker&family=Meow+Script&family=Rubik:wght@700;800&display=swap" /></noscript>
    <link rel="preload" as="image" href="/images/logo.webp" type="image/webp" />
    <script>
      // Start the page's banner photo now instead of after the app code has run (it is the largest thing on screen).
      (function () {
        var hero = { '/': 'hero', '/about': 'hero3', '/trips': 'trips-hero', '/destinations': 'destinations-hero' }[location.pathname.replace(/\/$/, '') || '/'];
        if (!hero) return;
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image';
        l.setAttribute('imagesrcset', '/images/' + hero + '-800.webp 800w, /images/' + hero + '.webp 1600w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
